<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Analytics Dashboard</title> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            color: #F1F5F9;
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366F1, #8B5CF6, #EC4899);
            opacity: 0.8;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .header-text h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #F1F5F9 0%, #A5B4FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: #94A3B8;
            font-size: 1rem;
            font-weight: 500;
        }

        .refresh-btn {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
            position: relative;
            overflow: hidden;
        }

        .refresh-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .refresh-btn:hover::before {
            left: 100%;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.5);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .refresh-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .refresh-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s;
        }

        .refresh-btn:disabled svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .last-updated {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
            color: #64748B;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .last-updated svg {
            width: 18px;
            height: 18px;
            fill: #6366F1;
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5rem 2rem;
            gap: 1.5rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366F1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #94A3B8;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .error-message {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(239, 68, 68, 0.05) 100%);
            border: 1px solid #EF4444;
            color: #FCA5A5;
            padding: 1.25rem 1.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            backdrop-filter: blur(10px);
        }

        .error-message.hidden {
            display: none;
        }

        .error-message svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 1.75rem;
            margin-bottom: 2.5rem;
        }

        .weather-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .weather-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .weather-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.3);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .weather-card:hover::before {
            transform: scaleX(1);
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.75rem;
        }

        .city-name {
            font-size: 1.75rem;
            font-weight: 700;
            color: #F1F5F9;
            letter-spacing: -0.01em;
        }

        .weather-icon-container {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.2);
        }

        .weather-icon {
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        .temperature {
            font-size: 4.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .description {
            color: #94A3B8;
            font-size: 1.125rem;
            margin-bottom: 2rem;
            text-transform: capitalize;
            font-weight: 500;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            padding-top: 1.75rem;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 1rem;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 12px;
            transition: all 0.3s;
        }

        .detail-item:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        .detail-label {
            color: #64748B;
            font-size: 0.813rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .detail-value {
            color: #F1F5F9;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .feels-like {
            grid-column: 1 / -1;
            margin-top: 0.75rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .feels-like .detail-label {
            margin-bottom: 0.5rem;
            color: #A5B4FC;
        }

        .feels-like .detail-value {
            justify-content: center;
            font-size: 2rem;
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .footer {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2rem;
            margin-top: 3rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .footer-content p {
            color: #64748B;
            font-size: 0.9rem;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: #818CF8;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
        }

        .footer-links a:hover {
            color: #6366F1;
            transform: translateY(-2px);
        }

        .footer-links span {
            color: #64748B;
        }

        .success-toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            padding: 1.25rem 2rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 20px 60px rgba(16, 185, 129, 0.4);
            z-index: 1000;
            font-weight: 600;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                padding: 1.5rem;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-text h1 {
                font-size: 1.75rem;
            }

            .weather-grid {
                grid-template-columns: 1fr;
                gap: 1.25rem;
            }

            .temperature {
                font-size: 3rem;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 3C8.68629 3 6 5.68629 6 9C6 11.4183 7.28187 13.5419 9.16667 14.5833V17C9.16667 18.1046 10.0621 19 11.1667 19H12.8333C13.9379 19 14.8333 18.1046 14.8333 17V14.5833C16.7181 13.5419 18 11.4183 18 9C18 5.68629 15.3137 3 12 3Z" fill="white"/>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1>Weather Analytics</h1>
                        <p class="subtitle">Real-Time Multi-city Weather Monitoring</p>
                    </div>
                </div>
                <button id="refreshBtn" class="refresh-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                    </svg>
                    Refresh Data
                </button>
            </div>
            <div id="lastUpdated" class="last-updated" style="display: none;">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
                    <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <span id="lastUpdatedText"></span>
            </div>
        </header>

        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner"></div>
            <p class="loading-text">Loading weather data...</p>
        </div>

        <div id="errorMessage" class="error-message hidden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="errorText"></span>
        </div>

        <div id="weatherGrid" class="weather-grid"></div>

        <footer class="footer">
            <div class="footer-content">
                <p>© 2024 Weather Analytics Dashboard | Powered by OpenWeather API</p>
                <div class="footer-links">
                    <a href="https://openweathermap.org" target="_blank">Data Source</a>
                    <span>•</span>
                    <a href="/api/weather" target="_blank">API Documentation</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const API_BASE = '/api';
        let isRefreshing = false;

        // Mock data for demonstration
        const mockData = {
            last_updated: new Date().toISOString(),
            cities: {
                Delhi: { temp: 28.5, humidity: 45, wind: 3.2, description: 'clear sky', icon: '01d', feels_like: 27.2, pressure: 1013, temp_min: 26.0, temp_max: 30.0 },
                Mumbai: { temp: 31.3, humidity: 65, wind: 4.1, description: 'partly cloudy', icon: '02d', feels_like: 33.1, pressure: 1011, temp_min: 29.0, temp_max: 33.0 },
                Bangalore: { temp: 24.7, humidity: 55, wind: 2.8, description: 'sunny', icon: '01d', feels_like: 24.5, pressure: 1014, temp_min: 22.0, temp_max: 27.0 },
                Chennai: { temp: 32.8, humidity: 70, wind: 5.2, description: 'humid', icon: '03d', feels_like: 36.2, pressure: 1010, temp_min: 31.0, temp_max: 34.0 },
                Hyderabad: { temp: 29.4, humidity: 48, wind: 3.6, description: 'clear', icon: '01d', feels_like: 29.1, pressure: 1012, temp_min: 27.0, temp_max: 31.0 }
            }
        };

        async function fetchWeatherData() {
            try {
                showLoading();
                hideError();

                // Try real API first, fallback to mock data
                try {
                    const response = await fetch(`${API_BASE}/weather`);
                    if (response.ok) {
                        const data = await response.json();
                        displayWeatherData(data);
                        updateLastUpdated(data.last_updated);
                    } else {
                        throw new Error('API not available');
                    }
                } catch (apiError) {
                    console.log('Using mock data for demonstration');
                    await new Promise(resolve => setTimeout(resolve, 800));
                    displayWeatherData(mockData);
                    updateLastUpdated(mockData.last_updated);
                }

                hideLoading();
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to load weather data. Please try again.');
                hideLoading();
            }
        }

        async function refreshWeatherData() {
            if (isRefreshing) return;

            try {
                isRefreshing = true;
                const refreshBtn = document.getElementById('refreshBtn');
                refreshBtn.disabled = true;
                
                showLoading();
                hideError();

                try {
                    const response = await fetch(`${API_BASE}/refresh`, { method: 'POST' });
                    if (response.ok) {
                        const result = await response.json();
                        displayWeatherData(result.data);
                        updateLastUpdated(result.data.last_updated);
                        showSuccessMessage('Weather data refreshed successfully!');
                    } else {
                        throw new Error('API not available');
                    }
                } catch (apiError) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    mockData.last_updated = new Date().toISOString();
                    displayWeatherData(mockData);
                    updateLastUpdated(mockData.last_updated);
                    showSuccessMessage('Weather data refreshed successfully!');
                }

                hideLoading();
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to refresh weather data. Please try again.');
                hideLoading();
            } finally {
                isRefreshing = false;
                document.getElementById('refreshBtn').disabled = false;
            }
        }

        function displayWeatherData(data) {
            const weatherGrid = document.getElementById('weatherGrid');
            weatherGrid.innerHTML = '';

            if (!data.cities || Object.keys(data.cities).length === 0) {
                weatherGrid.innerHTML = '<p style="text-align: center; color: #64748B; padding: 3rem;">No weather data available.</p>';
                return;
            }

            Object.entries(data.cities).forEach(([city, weather]) => {
                const card = createWeatherCard(city, weather);
                weatherGrid.appendChild(card);
            });
        }

        function createWeatherCard(city, weather) {
            const card = document.createElement('div');
            card.className = 'weather-card';
            
            const iconUrl = weather.icon ? `https://openweathermap.org/img/wn/${weather.icon}@4x.png` : '';
            const hasError = weather.error || weather.temp === null;

            card.innerHTML = `
                <div class="weather-header">
                    <h2 class="city-name">${city}</h2>
                    ${iconUrl ? `
                        <div class="weather-icon-container">
                            <img src="${iconUrl}" alt="${weather.description}" class="weather-icon">
                        </div>
                    ` : ''}
                </div>
                ${hasError ? `
                    <div style="text-align: center; padding: 2rem;">
                        <p style="color: #EF4444; font-size: 1.1rem; font-weight: 600;">Data unavailable</p>
                        ${weather.error ? `<p style="color: #64748B; font-size: 0.9rem; margin-top: 0.75rem;">${weather.error}</p>` : ''}
                    </div>
                ` : `
                    <div class="temperature">${weather.temp}°</div>
                    <div class="description">${weather.description || 'N/A'}</div>
                    <div class="weather-details">
                        <div class="detail-item">
                            <span class="detail-label">Humidity</span>
                            <span class="detail-value">${weather.humidity !== null ? weather.humidity + '%' : 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Wind Speed</span>
                            <span class="detail-value">${weather.wind !== null ? weather.wind + ' m/s' : 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Pressure</span>
                            <span class="detail-value">${weather.pressure ? weather.pressure + ' hPa' : 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Temp Range</span>
                            <span class="detail-value">${weather.temp_min}° - ${weather.temp_max}°</span>
                        </div>
                        <div class="feels-like">
                            <span class="detail-label">Feels Like</span>
                            <span class="detail-value">${weather.feels_like}°C</span>
                        </div>
                    </div>
                `}
            `;

            return card;
        }

        function updateLastUpdated(timestamp) {
            const lastUpdatedEl = document.getElementById('lastUpdated');
            const lastUpdatedText = document.getElementById('lastUpdatedText');
            if (timestamp) {
                const date = new Date(timestamp);
                const formattedDate = date.toLocaleString('en-IN', {
                    dateStyle: 'medium',
                    timeStyle: 'short'
                });
                lastUpdatedText.textContent = `Last updated: ${formattedDate}`;
                lastUpdatedEl.style.display = 'flex';
            }
        }

        function showLoading() {
            document.getElementById('loadingSpinner').style.display = 'flex';
            document.getElementById('weatherGrid').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('weatherGrid').style.display = 'grid';
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function showSuccessMessage(message) {
            const toast = document.createElement('div');
            toast.className = 'success-toast';
            toast.innerHTML = `
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <span>${message}</span>
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        document.getElementById('refreshBtn').addEventListener('click', refreshWeatherData);

        // Initialize
        fetchWeatherData();
    </script>
</body>
</html>
